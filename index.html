<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STUDY HARD</title>
<meta name="description" content="今日の努力が、未来の自分をつくる。勉強時間で経験値を貯めてレベルアップする、受験生のための学習管理アプリ。">
<meta name="theme-color" content="#04050b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STUDY HARD">
<meta property="og:title" content="STUDY HARD">
<meta property="og:description" content="勉強をゲームに。友達とランキングで競える受験生向け学習管理アプリ。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: HUD command deck — sticky status bar, column of glass modules, bottom dock on phones / side rail on desktop */
:root{
  color-scheme: dark;
  --bg:#04050b; --bg-2:#090d19; --ink:#e8eeff; --mute:#8e98b9; --dim:#5a6382;
  --glass:rgba(130,165,255,.055); --glass-2:rgba(130,165,255,.1); --line:rgba(130,175,255,.14); --line-2:rgba(130,175,255,.3);
  --cyan:#22e4ff; --blue:#3d7bff; --violet:#a46bff; --good:#3ee6a0; --warn:#ffc65c; --bad:#ff5c7a;
  --f-disp:"Chakra Petch","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --r:18px;
}
*,*::before,*::after{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);background:#04050b;-webkit-text-size-adjust:100%}
html,body{height:auto}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(60vw 50vh at 85% -10%, rgba(164,107,255,.20), transparent 70%),
   radial-gradient(55vw 45vh at -10% 20%, rgba(34,228,255,.13), transparent 70%),
   radial-gradient(70vw 50vh at 50% 120%, rgba(61,123,255,.14), transparent 70%),
   linear-gradient(rgba(130,175,255,.035) 1px, transparent 1px) 0 0/40px 40px,
   linear-gradient(90deg, rgba(130,175,255,.035) 1px, transparent 1px) 0 0/40px 40px,
   var(--bg);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;flex:none}
.disp{font-family:var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.mute{color:var(--mute)} .dim{color:var(--dim)}
.eyebrow{font-family:var(--f-disp);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);font-weight:600}

/* ---------- frame ---------- */
.app{position:relative;z-index:1;min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(4,5,11,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:10px;height:56px;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;font-size:17px;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand-mark{width:26px;height:26px}
.brand b{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.top-sp{flex:1}
.hchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-family:var(--f-disp);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hchip .ic{width:16px;height:16px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 3px rgba(90,99,130,.2)}
.sync.ok{background:var(--good);box-shadow:0 0 8px var(--good)}
.sync.saving{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.sync.local{background:var(--violet)}
.sync.err{background:var(--bad)}
.main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(6,8,16,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.dock-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
.dock a,.dock button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:10.5px;color:var(--mute);text-decoration:none;background:none;border:0;letter-spacing:.04em}
.dock .ic{width:22px;height:22px}
.dock .on{color:var(--cyan)}
.dock .on .ic{filter:drop-shadow(0 0 6px rgba(34,228,255,.7))}
.rail{display:none}
@media (min-width:960px){
  .dock{display:none}
  .shell{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1180px;margin:0 auto;gap:0}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));align-self:start;padding:18px 10px 18px max(16px,env(safe-area-inset-left,0px));height:calc(100vh - 56px)}
  .rail a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:var(--mute);text-decoration:none;font-size:14px}
  .rail a:hover{background:var(--glass);color:var(--ink)}
  .rail a.on{background:linear-gradient(90deg,rgba(34,228,255,.14),rgba(164,107,255,.06));color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
  .rail a.on .ic{color:var(--cyan)}
  .main{padding-left:16px;padding-bottom:40px;margin:0;max-width:none}
}

/* ---------- modules ---------- */
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.panel{position:relative;background:linear-gradient(180deg,rgba(150,180,255,.07),rgba(150,180,255,.025));border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
.panel.hero{background:radial-gradient(120% 120% at 0% 0%,rgba(34,228,255,.12),transparent 55%),radial-gradient(120% 120% at 100% 100%,rgba(164,107,255,.16),transparent 55%),rgba(10,14,28,.7);border-color:var(--line-2)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ph h2,.ph h3{margin:0;font-size:16px;font-weight:700;text-wrap:balance}
.ph .eyebrow{display:block;margin-bottom:2px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 2px}
.pagehead h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass-2);color:var(--ink);font-weight:500;text-decoration:none;transition:transform .12s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:rgba(130,165,255,.16)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{border:0;background:linear-gradient(100deg,#19c9ff,#4b7dff 55%,#9a5cff);color:#04050b;font-weight:700;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 8px 30px -8px rgba(34,228,255,.6)}
.btn.primary:hover{box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 10px 36px -6px rgba(34,228,255,.8)}
.btn.big{min-height:56px;font-size:17px;padding:0 26px;border-radius:16px;letter-spacing:.06em}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,92,122,.5);color:#ff9fb1}
.btn.wide{width:100%}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;color:var(--mute);font-size:13px}
.seg button.on{background:linear-gradient(100deg,rgba(34,228,255,.22),rgba(164,107,255,.22));color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:13px;color:var(--mute)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,#999);box-shadow:0 0 8px var(--c,#999)}
.chip.on{color:var(--ink);border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 12px rgba(34,228,255,.6);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv .k{font-size:12px;color:var(--mute)}
.kv .v{font-family:var(--f-disp);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kv .v small{font-size:13px;color:var(--mute);font-weight:500;margin-left:2px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .t{min-width:0;flex:1}
.li .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{font-size:12px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{background:rgba(0,0,0,.4);border:1px solid var(--line-2);border-radius:11px;padding:10px 12px;color:var(--ink);font-size:16px;min-width:0;width:100%}
textarea{min-height:84px;resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,228,255,.18)}
.tog{position:relative;width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);border:0;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#cfd6ea;transition:transform .2s}
.tog.on{background:linear-gradient(90deg,var(--cyan),var(--violet))}
.tog.on::after{transform:translateX(20px);background:#fff}
.note{font-size:12.5px;color:var(--mute);line-height:1.7}
.empty{padding:22px 10px;text-align:center;color:var(--mute);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line-2);color:var(--mute);white-space:nowrap}
.pill.good{color:var(--good);border-color:rgba(62,230,160,.45);background:rgba(62,230,160,.08)}
.pill.warn{color:var(--warn);border-color:rgba(255,198,92,.45)}
.pill.cy{color:var(--cyan);border-color:rgba(34,228,255,.45)}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid rgba(164,107,255,.45);background:linear-gradient(90deg,rgba(164,107,255,.18),rgba(34,228,255,.08));font-size:14px}

/* ---------- home ---------- */
.home-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:560px){.home-hero{grid-template-columns:1fr;justify-items:center;text-align:center}.home-hero .row{justify-content:center}}
.ringwrap{position:relative;width:176px;height:176px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .rc .disp{font-size:34px;font-weight:600;line-height:1}
.ringwrap .rc small{font-size:12px;color:var(--mute);margin-top:6px}
.lvcard .lvnum{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1;background:linear-gradient(180deg,#fff,#9fd9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.mission{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.mission:first-child{border-top:0}
.mcheck{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.mission.done .mcheck{background:linear-gradient(135deg,var(--cyan),var(--violet));border:0;color:#04050b}
.mission.done .mt{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3)}
.mission .mt{flex:1;min-width:0;font-size:14px}
.roomcard{display:block;text-decoration:none;color:inherit;overflow:hidden}
.roomcard .rv{margin:-6px -6px 0;border-radius:14px;background:radial-gradient(80% 80% at 50% 40%,rgba(61,123,255,.16),transparent 70%)}
.quote{font-size:15px;line-height:1.9}
.quote cite{display:block;font-style:normal;color:var(--mute);font-size:12px;margin-top:6px}

/* ---------- timer ---------- */
.tface{display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 0}
.tring{position:relative;width:min(300px,78vw);aspect-ratio:1;max-width:100%}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ttime{font-family:var(--f-disp);font-size:clamp(46px,14vw,68px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.03em;line-height:1;text-shadow:0 0 24px rgba(34,228,255,.35)}
.tphase{font-family:var(--f-disp);font-size:12px;letter-spacing:.24em;color:var(--cyan)}
.tphase.brk{color:var(--good)}
.tsubj{font-size:14px;color:var(--mute)}
.tctl{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.running .tring svg .prog{filter:drop-shadow(0 0 8px rgba(34,228,255,.8))}
.cheer{font-size:14px;color:var(--mute);text-align:center;min-height:1.6em;max-width:36ch}
.sounds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.snd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--mute);font-size:12.5px}
.snd.on{color:var(--ink);border-color:var(--cyan);background:rgba(34,228,255,.1);box-shadow:0 0 18px -6px rgba(34,228,255,.7)}
.snd .ic{width:24px;height:24px}
input[type=range]{width:100%;accent-color:var(--cyan)}

/* ---------- stats ---------- */
.chart svg{width:100%;height:auto;display:block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:11px;color:var(--dim);text-align:center}
.cal .d{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:12px;font-family:var(--f-disp);color:var(--mute);background:rgba(255,255,255,.035);border:1px solid transparent;font-variant-numeric:tabular-nums}
.cal .d.l1{background:rgba(34,228,255,.12);color:var(--ink)}
.cal .d.l2{background:rgba(34,228,255,.26);color:var(--ink)}
.cal .d.l3{background:rgba(61,123,255,.45);color:#fff}
.cal .d.l4{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#04050b;font-weight:700;box-shadow:0 0 12px -2px rgba(34,228,255,.7)}
.cal .d.today{border-color:var(--cyan)}
.cal .d.x{visibility:hidden}
.legend{display:flex;flex-direction:column;gap:6px}
.legend .row{font-size:13px}

/* ---------- room ---------- */
.roomstage{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line-2);background:radial-gradient(70% 60% at 50% 45%,rgba(61,123,255,.18),transparent 70%),radial-gradient(60% 50% at 50% 100%,rgba(164,107,255,.16),transparent 70%),#05070f}
.roomstage svg{display:block;width:100%;height:auto;max-height:68vh;touch-action:manipulation}
.roomsvg [data-i]{cursor:pointer}
.roomsvg .tile{cursor:pointer}
.roomsvg .sel polygon,.roomsvg .sel rect{stroke:var(--cyan)!important;stroke-width:1.6!important;stroke-opacity:1!important}
.roomsvg .sel{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.78}}
.rb-head{display:flex;align-items:center;gap:6px;font-size:13px;padding:0 4px 7px;min-width:0}
.rb-head .ic{width:16px;height:16px;color:var(--cyan);flex:none}
.rb-head b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(52px,1fr));gap:6px}
.tool{user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;padding:4px 2px;border-radius:11px;border:1px solid var(--line);background:var(--glass-2);font-size:10.5px;line-height:1.2;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .1s,background .15s}
.tool .ic{width:18px;height:18px}
.tool:hover{background:rgba(130,165,255,.16)}
.tool:active{transform:scale(.94);background:rgba(34,228,255,.18)}
.tool.on{border-color:var(--cyan);color:var(--cyan);background:rgba(34,228,255,.1)}
.rb-move{display:flex;gap:8px;align-items:stretch}
.pad{display:grid;grid-template-columns:repeat(2,50px);grid-auto-rows:48px;gap:6px;flex:none}
.pad .tool{min-height:0}
.rb-move .rb-tools{flex:1;align-content:stretch}
.tool.go{border:0;background:linear-gradient(100deg,#19c9ff,#4b7dff 55%,#9a5cff);color:#04050b;font-weight:700;font-size:12px}
.tool:disabled{opacity:.35}
.tool.go.warn{background:linear-gradient(100deg,#ffb04d,#ff6f8f);color:#1a0610}
.pill.bad{color:#ff9fb1;border-color:rgba(255,92,122,.5)}
.roomsvg .ghost{filter:drop-shadow(0 0 5px rgba(34,228,255,.95))}
.roomsvg .ghost.bad{filter:drop-shadow(0 0 5px rgba(255,92,122,.95));opacity:.72}
.roombar{position:relative;margin:0 10px 10px;display:block;padding:8px;border-radius:14px;background:rgba(5,8,18,.85);border:1px solid var(--line-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.roomtop{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.roomtop>*{pointer-events:auto}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.item{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);min-width:0}
.item .thumb{height:86px;border-radius:10px;background:radial-gradient(70% 70% at 50% 50%,rgba(61,123,255,.14),transparent 70%);display:grid;place-items:center}
.item .thumb svg{max-height:86px;width:100%}
.item b{font-size:13px;font-weight:500}
.item .meta{font-size:11.5px;color:var(--mute);display:flex;justify-content:space-between;gap:6px}
.item.locked{opacity:.55}

function genBooks(){
  const out = [], cols = ['#d9576e','#3fb8ff','#ffc24d','#6fcf6a','#a98bff','#eef0f6','#ff9350','#22c4d6','#2b3a7a'];
  let s = 11; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let lvl = 0; lvl < 4; lvl++) {
    const z = lvl * .75 + .08; let x = .12;
    while (x < 1.8) { const w = .1 + rnd() * .07, h = .4 + rnd() * .22; if (x + w > 1.88) break;
      out.push([x, .14, z, w, .56, h, cols[Math.floor(rnd() * cols.length)]]); x += w + .012; if (rnd() < .13) x += .14; }
  }
  return out;
}

VIEWS.stats = () => {
  const st = S(), x = stats(), today = dkey(), mode = UI.statMode;
  let cols = [], goal = 0, rangeLabel = '';
  const subs = st.subjects;
  if (mode === 'day') {
    for (let i = 6; i >= 0; i--) { const k = addDays(today, -i), sd = x.subjDay[k] || {};
      cols.push({label: i === 0 ? '今日' : `${parseD(k).getDate()}${WD[parseD(k).getDay()]}`, hl: i === 0, segs: subs.map(s => ({v: sd[s.id] || 0, c: s.color})).concat(Object.keys(sd).filter(id => !subs.find(s => s.id === id)).map(id => ({v: sd[id], c: '#9aa3c0'})))}); }
    goal = st.dailyGoal; rangeLabel = '直近7日';
  } else if (mode === 'week') {
    const ws = weekStart(today);
    for (let i = 7; i >= 0; i--) { const w0 = addDays(ws, -7 * i); let v = 0; for (let j = 0; j < 7; j++) v += x.byDay[addDays(w0, j)] || 0;
      cols.push({label: fmtMD(w0), hl: i === 0, segs: [{v, c: i === 0 ? '#22e4ff' : '#3d7bff'}]}); }
    goal = st.dailyGoal * 7; rangeLabel = '直近8週（週の始まり＝月曜）';
  } else {
    const mk = monthOf(today);
    for (let i = 5; i >= 0; i--) { const m = addMonths(mk, -i); let v = 0; for (const d in x.byDay) if (monthOf(d) === m) v += x.byDay[d];
      cols.push({label: `${+m.slice(5)}月`, hl: i === 0, segs: [{v, c: i === 0 ? '#a46bff' : '#6b5bd6'}]}); }
    goal = st.dailyGoal * daysInMonth(mk); rangeLabel = '直近6か月';
  }
  const totals = cols.map(c => c.segs.reduce((a, s) => a + s.v, 0)), sum = totals.reduce((a, b) => a + b, 0);
  const avg = mode === 'day' ? sum / 7 : sum / cols.length;
  // donut
  let from = '0000', lbl = '全期間';
  if (UI.donut === 'week') { from = weekStart(today); lbl = '今週'; } else if (UI.donut === 'month') { from = monthOf(today) + '-01'; lbl = '今月'; }
  const per = {}; for (const s of x.sessions) if (s.d >= from) per[s.s] = (per[s.s] || 0) + s.m;
  const items = Object.entries(per).map(([id, v]) => ({id, v, c: subjOf(id).color, n: subjOf(id).name})).sort((a, b) => b.v - a.v);
  const dtot = items.reduce((a, i) => a + i.v, 0);
  // calendar
  const cm = UI.calMonth, first = parseD(cm + '-01'), lead = (first.getDay() + 6) % 7, nd = daysInMonth(cm);
  let cal = ['月','火','水','木','金','土','日'].map(w => `<span class="h">${w}</span>`).join('');
  for (let i = 0; i < lead; i++) cal += '<span class="d x"></span>';
  let studiedDays = 0, goalDaysM = 0, elapsedDays = 0;
  for (let d = 1; d <= nd; d++) { const k = `${cm}-${pad2(d)}`, v = x.byDay[k] || 0, g = goalFor(k), r = g ? v / g : 0;
    if (k <= today) elapsedDays++; if (v >= STREAK_MIN) studiedDays++; if (g && v >= g) goalDaysM++;
    const lvl = v < STREAK_MIN ? 0 : r >= 1 ? 4 : r >= .5 ? 3 : r >= .25 ? 2 : 1;
    cal += `<span class="d ${lvl ? 'l' + lvl : ''} ${k === today ? 'today' : ''}" title="${fmtMD(k)} ${fmtHM(v)}">${d}</span>`; }
  const recent = x.sessions.slice().sort((a, b) => b.t - a.t).slice(0, 40);
  return `<div class="pagehead"><h1>記録・分析</h1><div class="seg">${[['day','日別'],['week','週別'],['month','月別']].map(([k, n]) => `<button data-act="stat-mode" data-v="${k}" class="${mode === k ? 'on' : ''}">${n}</button>`).join('')}</div></div>
  <div class="grid3">
    <section class="panel"><div class="kv"><span class="k">累計勉強時間</span><span class="v">${hmParts(x.total)[0]}<small>時間</small>${hmParts(x.total)[1]}<small>分</small></span></div></section>
    <section class="panel"><div class="kv"><span class="k">今週 / 今月</span><span class="v">${(x.weekMin / 60).toFixed(1)}<small>h</small> <span class="dim">/</span> ${(x.monthMin / 60).toFixed(1)}<small>h</small></span></div></section>
    <section class="panel"><div class="kv"><span class="k">${mode === 'day' ? '1日' : mode === 'week' ? '1週' : '1か月'}の平均と目標</span><span class="v">${fmtHM(avg)}</span></div><p class="note" style="margin:4px 0 0">目標 ${fmtHM(goal)} に対して ${goal ? Math.round(avg / goal * 100) : 0}%</p></section>
  </div>
  <section class="panel chart"><div class="ph"><div><span class="eyebrow">${rangeLabel}</span><h2>勉強時間の推移</h2></div><span class="pill warn">点線＝目標</span></div>${barChart(cols, goal)}
    ${mode === 'day' ? `<div class="chips" style="margin-top:10px">${subs.filter(s => cols.some(c => c.segs.find(g => g.c === s.color && g.v > 0))).map(s => `<span class="chip" style="--c:${s.color}"><i></i>${esc(s.name)}</span>`).join('')}</div>` : ''}</section>
  <div class="grid2">
    <section class="panel"><div class="ph"><h2>科目別の割合</h2><div class="seg">${[['week','今週'],['month','今月'],['all','全期間']].map(([k, n]) => `<button data-act="donut" data-v="${k}" class="${UI.donut === k ? 'on' : ''}">${n}</button>`).join('')}</div></div>
      <div class="row" style="align-items:center;gap:18px;flex-wrap:wrap"><div style="width:150px;flex:none">${donut(items)}</div>
      <div class="legend" style="flex:1;min-width:150px">${items.length ? items.map(i => `<div class="row"><span class="dot" style="--c:${i.c}"></span><span style="flex:1">${esc(i.n)}</span><span class="disp mute">${fmtHM(i.v)}</span><span class="disp" style="width:42px;text-align:right">${Math.round(i.v / dtot * 100)}%</span></div>`).join('') : `<p class="note">${lbl}の記録はまだありません。</p>`}</div></div></section>
    <section class="panel"><div class="ph"><div><span class="eyebrow">STREAK</span><h2>連続勉強記録</h2></div><div class="row" style="gap:4px"><button class="btn sm ghost" data-act="cal" data-v="-1" aria-label="前の月">${icon('chevL')}</button><b class="disp" style="font-size:14px">${cm.replace('-', '.')}</b><button class="btn sm ghost" data-act="cal" data-v="1" aria-label="次の月">${icon('chevR')}</button></div></div>
      <div class="row wrap" style="gap:16px;margin-bottom:12px"><div class="kv"><span class="k">現在</span><span class="v" style="font-size:18px;color:#ffb067">${x.streak}<small>日</small></span></div><div class="kv"><span class="k">最長</span><span class="v" style="font-size:18px">${x.best}<small>日</small></span></div><div class="kv"><span class="k">月間達成率</span><span class="v" style="font-size:18px">${elapsedDays ? Math.round(studiedDays / elapsedDays * 100) : 0}<small>%</small></span></div><div class="kv"><span class="k">目標達成日</span><span class="v" style="font-size:18px">${goalDaysM}<small>日</small></span></div></div>
      <div class="cal">${cal}</div><p class="note" style="margin:10px 0 0">色が濃いほど目標に近い日。グラデーションは目標達成日です。月間達成率＝その月の経過日数のうち勉強した日の割合。</p></section>
  </div>
  <section class="panel"><div class="ph"><h2>過去の勉強記録</h2><span class="note">最新40件</span></div>
    ${recent.length ? `<div class="list">${recent.map(s => { const sj = subjOf(s.s), t = new Date(s.t); const conf = UI.histConfirm === s.id;
      return `<div class="li"><span class="dot" style="--c:${sj.color}"></span><div class="t"><b>${esc(sj.name)}</b><span>${fmtMD(s.d)}（${WD[parseD(s.d).getDay()]}）${pad2(t.getHours())}:${pad2(t.getMinutes())}〜 · ${s.k === 'sw' ? 'ストップウォッチ' : 'カウントダウン'}</span></div><span class="disp">${fmtHM(s.m)}</span>
      ${conf ? `<button class="btn sm danger" data-act="hist-del" data-v="${s.id}" data-m="${monthOf(s.d)}">削除する</button><button class="btn sm ghost" data-act="hist-cancel">戻す</button>` : `<button class="btn sm ghost" data-act="hist-ask" data-v="${s.id}" aria-label="この記録を削除">${icon('trash')}</button>`}</div>`; }).join('')}</div>` : '<div class="empty">まだ記録がありません。タイマーで勉強すると、ここに自動で残ります。</div>'}
    <p class="note" style="margin:10px 0 0">記録を削除すると、その分の経験値とコインも減ります。</p></section>`;
};

const CHAT = {room: null, msgs: [], chan: null, poll: null, ready: null, previews: {}, prevAt: 0, sending: false, draft: ''};
const dmRoom = uid => 'd:' + [UID, uid].sort().join(':');
function chatRooms(){
  const st = S(), rooms = [];
  for (const g of (st.groups || [])) rooms.push({id: 'g:' + g.c, name: groupName(g.c) || g.n, sub: `グループ · ${groupMembers(g.c).length}人`, kind: 'g'});
  const seen = new Set();
  for (const d of pubDocs) { if (d.uid === UID || seen.has(d.uid)) continue;
    if (st.friends.includes(d.code) || (Array.isArray(d.fr) && d.fr.includes(st.code))) { seen.add(d.uid); rooms.push({id: dmRoom(d.uid), name: d.nick || 'ななしの受験生', sub: d.hasStats ? `フレンド · LV${d.lv || 1}` : 'フレンド', kind: 'd'}); } }
  return rooms;
}
const chatMissing = e => e && (/42P01|PGRST205|PGRST202/.test(e.code || '') || /messages|schema cache|does not exist/i.test(e.message || ''));
const readMap = () => LS.get('sh-chat-read') || {};
function markRead(room){ const m = readMap(); m[room] = Date.now(); LS.set('sh-chat-read', m); }
async function loadPreviews(force){
  if (MODE !== 'cloud' || (!force && Date.now() - CHAT.prevAt < 15000)) return; CHAT.prevAt = Date.now();
  const rooms = chatRooms(); if (!rooms.length) { CHAT.ready = CHAT.ready ?? true; return; }
  const res = await Promise.all(rooms.map(r => SB.from('messages').select('id,user_id,nick,body,created_at').eq('room', r.id).order('id', {ascending: false}).limit(1)));
  for (let i = 0; i < rooms.length; i++) { const {data: rows, error} = res[i]; if (error) { if (chatMissing(error)) { CHAT.ready = false; break; } continue; } CHAT.ready = true; CHAT.previews[rooms[i].id] = rows[0] || null; }
  if (route() === 'chat' && !CHAT.room) scheduleRender();
}
const msgName = m => { const d = pubDocs.find(p => p.uid === m.user_id); return (d && d.nick) || m.nick || 'ななしの受験生'; };
const hhmm = iso => { const d = new Date(iso); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
function msgHTML(m, prev){
  const mine = m.user_id === UID, day = dkey(new Date(m.created_at)), pday = prev ? dkey(new Date(prev.created_at)) : null;
  const same = prev && prev.user_id === m.user_id && pday === day && (new Date(m.created_at) - new Date(prev.created_at)) < 5 * 60000;
  return `${day !== pday ? `<div class="cday"><span>${fmtDate(day)}</span></div>` : ''}<div class="msg2 ${mine ? 'me' : ''} ${same ? 'cont' : ''}" data-mid="${m.id}">
    ${!mine && !same ? `<div class="who">${esc(msgName(m))}</div>` : ''}
    <div class="mrow">${mine ? `<button class="mdel" data-act="chat-del" data-v="${m.id}" aria-label="このメッセージを削除">${icon('trash')}</button>` : ''}<div class="mb">${esc(m.body)}</div><span class="mt">${hhmm(m.created_at)}</span></div></div>`;
}
function paintLog(stick){
  const log = $('#chat-log'); if (!log) return;
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  log.innerHTML = CHAT.msgs.length ? CHAT.msgs.map((m, i) => msgHTML(m, CHAT.msgs[i - 1])).join('') : '<div class="empty">まだメッセージはありません。最初のひと言を送ってみよう。</div>';

function addMsgs(rows){
  let added = false;
  for (const m of rows) if (m && m.room === CHAT.room && !CHAT.msgs.some(x => x.id === m.id)) { CHAT.msgs.push(m); added = true; }
  if (added) { CHAT.msgs.sort((a, b) => a.id - b.id); if (CHAT.msgs.length > 300) CHAT.msgs = CHAT.msgs.slice(-300); paintLog(false); markRead(CHAT.room); }
}
async function openChat(id){
  closeChat(); CHAT.room = id; CHAT.msgs = []; CHAT.draft = '';
  if (route() !== 'chat') location.hash = '#chat'; else render();
  const {data: rows, error} = await SB.from('messages').select('id,room,user_id,nick,body,created_at').eq('room', id).order('id', {ascending: false}).limit(100);
  if (CHAT.room !== id) return;
  if (error) { CHAT.ready = chatMissing(error) ? false : CHAT.ready; render(); if (!chatMissing(error)) toast('メッセージを読み込めませんでした。', 'x'); return; }
  CHAT.ready = true; CHAT.msgs = rows.reverse(); paintLog(true); markRead(id);
  try {
    CHAT.chan = SB.channel('room-' + id.replace(/[^a-zA-Z0-9]/g, '').slice(0, 60))
      .on('postgres_changes', {event: 'INSERT', schema: 'public', table: 'messages', filter: `room=eq.${id}`}, p => addMsgs([p.new]))
      .on('postgres_changes', {event: 'DELETE', schema: 'public', table: 'messages'}, p => { const old = p.old || {}; if (CHAT.msgs.some(m => m.id === old.id)) { CHAT.msgs = CHAT.msgs.filter(m => m.id !== old.id); paintLog(false); } })
      .subscribe();
  } catch {}
  CHAT.poll = setInterval(async () => {
    if (CHAT.room !== id || document.hidden) return;
    const last = CHAT.msgs.length ? CHAT.msgs[CHAT.msgs.length - 1].id : 0;
    const {data: more} = await SB.from('messages').select('id,room,user_id,nick,body,created_at').eq('room', id).gt('id', last).order('id', {ascending: true}).limit(50);
    if (more && more.length) addMsgs(more);
  }, 6000);
}
function closeChat(){ if (CHAT.chan) { try { SB.removeChannel(CHAT.chan); } catch {} CHAT.chan = null; } clearInterval(CHAT.poll); CHAT.poll = null; CHAT.room = null; }
async function sendChat(f){
  const inp = f.querySelector('#chat-in'), body = (inp.value || '').trim();
  if (!body || CHAT.sending || !CHAT.room) return;
  if (body.length > 500) { toast('500文字までです。', 'x'); return; }
  CHAT.sending = true; const room = CHAT.room;
  const {data: row, error} = await SB.from('messages').insert({room, nick: (S().nickname || '').slice(0, 20), body}).select('id,room,user_id,nick,body,created_at').single();
  CHAT.sending = false;
  if (error) { toast(chatMissing(error) ? 'チャットの設定（chat.sql）がまだです。' : room.startsWith('g:') ? '送れませんでした。ランキング参加がオンになっているか確認してください。' : '送れませんでした。フレンド登録とランキング参加がオンになっているか確認してください。', 'x', 6000); return; }
  inp.value = ''; CHAT.draft = ''; addMsgs([row]); paintLog(true); inp.focus();

/* ---------- sign-in screen ---------- */
function authMsg(e){
  const m = String((e && e.message) || '').toLowerCase();
  if (m.includes('invalid login')) return 'メールアドレスかパスワードが違います。';
  if (m.includes('already registered') || m.includes('already been registered') || m.includes('already exists')) return 'このメールアドレスはすでに登録されています。「ログイン」からどうぞ。';
  if (m.includes('password should') || m.includes('at least 6') || m.includes('weak')) return 'パスワードは6文字以上にしてください。';
  if (m.includes('not confirmed')) return 'メールの確認がまだです。届いたメールのリンクを押してから、もう一度ログインしてください。';
  if (m.includes('rate limit') || m.includes('too many') || m.includes('security purposes')) return '短い時間に何度も試したため、少し待ってからもう一度お試しください。';
  if (m.includes('invalid') && m.includes('email')) return 'メールアドレスの形を確認してください。';
  if (m.includes('fetch') || m.includes('network')) return '通信できませんでした。電波の状態を確認してください。';
  return 'うまくいきませんでした：' + ((e && e.message) || '不明なエラー');
}

    <div class="feat"><div>${icon('timer')}勉強タイマー</div><div>${icon('room')}育つ勉強部屋</div><div>${icon('trophy')}友達ランキング</div></div>

    </form>
    <div class="row wrap" style="justify-content:center;margin-top:10px">${t === 'reset' ? '<button class="btn sm ghost" data-act="auth-tab" data-v="login">ログインに戻る</button>' : '<button class="btn sm ghost" data-act="auth-tab" data-v="reset">パスワードを忘れた</button>'}</div>

}
async function doAuth(f){
  if (UI.authBusy) return;
  const t = UI.authTab, email = (f.querySelector('#au-email')?.value || '').trim(), pw = f.querySelector('#au-pw')?.value || '';
  const nick = (f.querySelector('#au-nick')?.value || '').trim();
  if (!email) { UI.authMsg = {text: 'メールアドレスを入力してください。'}; render(); return; }
  if (t !== 'reset' && pw.length < 6) { UI.authMsg = {text: 'パスワードは6文字以上にしてください。'}; render(); return; }
  UI.authBusy = true; UI.authMsg = null; render();
  try {
    if (t === 'login') {
      const {data: d, error} = await SB.auth.signInWithPassword({email, password: pw});
      if (error) throw error;
      UI.authBusy = false; await startCloud(d.user); return;
    }
    if (t === 'signup') {
      UI.signupNick = nick.slice(0, 20);
      const {data: d, error} = await SB.auth.signUp({email, password: pw, options: {emailRedirectTo: location.origin + location.pathname}});
      if (error) throw error;
      if (d.session) { UI.authBusy = false; await startCloud(d.user); return; }
      if (d.user && Array.isArray(d.user.identities) && d.user.identities.length === 0) throw new Error('already registered');
      UI.authTab = 'login'; UI.authMsg = {ok: true, text: '確認メールを送りました。メールのリンクを押したあと、ここからログインしてください。'};
    }
    if (t === 'reset') {
      const {error} = await SB.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
      if (error) throw error;
      UI.authMsg = {ok: true, text: 'パスワード再設定のメールを送りました。メールのリンクを開いてください。'};
    }
  } catch (e) { UI.authMsg = {text: authMsg(e)}; }
  UI.authBusy = false; render();
  setTimeout(() => { const v = $('#au-email'); if (v && !v.value) v.value = email; }, 0);
}
