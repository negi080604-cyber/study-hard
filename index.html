<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>STUDY HARD</title>
<meta name="description" content="今日の努力が、未来の自分をつくる。勉強時間で経験値を貯めてレベルアップする、受験生のための学習管理アプリ。">
<meta name="theme-color" content="#04050b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="STUDY HARD">
<meta property="og:title" content="STUDY HARD">
<meta property="og:description" content="勉強をゲームに。友達とランキングで競える受験生向け学習管理アプリ。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: HUD command deck — sticky status bar, column of glass modules, bottom dock on phones / side rail on desktop */
:root{
  color-scheme: dark;
  --bg:#04050b; --bg-2:#090d19; --ink:#e8eeff; --mute:#8e98b9; --dim:#5a6382;
  --glass:rgba(130,165,255,.055); --glass-2:rgba(130,165,255,.1); --line:rgba(130,175,255,.14); --line-2:rgba(130,175,255,.3);
  --cyan:#22e4ff; --blue:#3d7bff; --violet:#a46bff; --good:#3ee6a0; --warn:#ffc65c; --bad:#ff5c7a;
  --f-disp:"Chakra Petch","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --r:18px;
}
*,*::before,*::after{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);background:#04050b;-webkit-text-size-adjust:100%}
html,body{height:auto}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(60vw 50vh at 85% -10%, rgba(164,107,255,.20), transparent 70%),
   radial-gradient(55vw 45vh at -10% 20%, rgba(34,228,255,.13), transparent 70%),
   radial-gradient(70vw 50vh at 50% 120%, rgba(61,123,255,.14), transparent 70%),
   linear-gradient(rgba(130,175,255,.035) 1px, transparent 1px) 0 0/40px 40px,
   linear-gradient(90deg, rgba(130,175,255,.035) 1px, transparent 1px) 0 0/40px 40px,
   var(--bg);}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
.ic{width:20px;height:20px;flex:none}
.disp{font-family:var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.mute{color:var(--mute)} .dim{color:var(--dim)}
.eyebrow{font-family:var(--f-disp);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);font-weight:600}

/* ---------- frame ---------- */
.app{position:relative;z-index:1;min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(4,5,11,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:10px;height:56px;max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;font-size:17px;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand-mark{width:26px;height:26px}
.brand b{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.top-sp{flex:1}
.hchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-family:var(--f-disp);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.hchip .ic{width:16px;height:16px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 3px rgba(90,99,130,.2)}
.sync.ok{background:var(--good);box-shadow:0 0 8px var(--good)}
.sync.saving{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.sync.local{background:var(--violet)}
.sync.err{background:var(--bad)}
.main{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(6,8,16,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.dock-in{display:grid;grid-template-columns:repeat(5,1fr);max-width:560px;margin:0 auto}
.dock a,.dock button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:10.5px;color:var(--mute);text-decoration:none;background:none;border:0;letter-spacing:.04em}
.dock .ic{width:22px;height:22px}
.dock .on{color:var(--cyan)}
.dock .on .ic{filter:drop-shadow(0 0 6px rgba(34,228,255,.7))}
.rail{display:none}
@media (min-width:960px){
  .dock{display:none}
  .shell{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1180px;margin:0 auto;gap:0}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));align-self:start;padding:18px 10px 18px max(16px,env(safe-area-inset-left,0px));height:calc(100vh - 56px)}
  .rail a{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;color:var(--mute);text-decoration:none;font-size:14px}
  .rail a:hover{background:var(--glass);color:var(--ink)}
  .rail a.on{background:linear-gradient(90deg,rgba(34,228,255,.14),rgba(164,107,255,.06));color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
  .rail a.on .ic{color:var(--cyan)}
  .main{padding-left:16px;padding-bottom:40px;margin:0;max-width:none}
}

/* ---------- modules ---------- */
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.panel{position:relative;background:linear-gradient(180deg,rgba(150,180,255,.07),rgba(150,180,255,.025));border:1px solid var(--line);border-radius:var(--r);padding:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);min-width:0}
.panel.hero{background:radial-gradient(120% 120% at 0% 0%,rgba(34,228,255,.12),transparent 55%),radial-gradient(120% 120% at 100% 100%,rgba(164,107,255,.16),transparent 55%),rgba(10,14,28,.7);border-color:var(--line-2)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ph h2,.ph h3{margin:0;font-size:16px;font-weight:700;text-wrap:balance}
.ph .eyebrow{display:block;margin-bottom:2px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:4px 0 2px}
.pagehead h1{margin:0;font-size:24px;font-weight:700;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--glass-2);color:var(--ink);font-weight:500;text-decoration:none;transition:transform .12s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{background:rgba(130,165,255,.16)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{border:0;background:linear-gradient(100deg,#19c9ff,#4b7dff 55%,#9a5cff);color:#04050b;font-weight:700;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset,0 8px 30px -8px rgba(34,228,255,.6)}
.btn.primary:hover{box-shadow:0 0 0 1px rgba(255,255,255,.2) inset,0 10px 36px -6px rgba(34,228,255,.8)}
.btn.big{min-height:56px;font-size:17px;padding:0 26px;border-radius:16px;letter-spacing:.06em}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,92,122,.5);color:#ff9fb1}
.btn.wide{width:100%}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:rgba(0,0,0,.35);border:1px solid var(--line);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;color:var(--mute);font-size:13px}
.seg button.on{background:linear-gradient(100deg,rgba(34,228,255,.22),rgba(164,107,255,.22));color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:13px;color:var(--mute)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c,#999);box-shadow:0 0 8px var(--c,#999)}
.chip.on{color:var(--ink);border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 12px rgba(34,228,255,.6);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv .k{font-size:12px;color:var(--mute)}
.kv .v{font-family:var(--f-disp);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kv .v small{font-size:13px;color:var(--mute);font-weight:500;margin-left:2px}
.row{display:flex;align-items:center;gap:12px;min-width:0}
.row.wrap{flex-wrap:wrap}
.sp{flex:1}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .t{min-width:0;flex:1}
.li .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{font-size:12px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);flex:none}
label.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute);min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{background:rgba(0,0,0,.4);border:1px solid var(--line-2);border-radius:11px;padding:10px 12px;color:var(--ink);font-size:16px;min-width:0;width:100%}
textarea{min-height:84px;resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,228,255,.18)}
.tog{position:relative;width:46px;height:26px;border-radius:99px;background:rgba(255,255,255,.12);border:0;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#cfd6ea;transition:transform .2s}
.tog.on{background:linear-gradient(90deg,var(--cyan),var(--violet))}
.tog.on::after{transform:translateX(20px);background:#fff}
.note{font-size:12.5px;color:var(--mute);line-height:1.7}
.empty{padding:22px 10px;text-align:center;color:var(--mute);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid var(--line-2);color:var(--mute);white-space:nowrap}
.pill.good{color:var(--good);border-color:rgba(62,230,160,.45);background:rgba(62,230,160,.08)}
.pill.warn{color:var(--warn);border-color:rgba(255,198,92,.45)}
.pill.cy{color:var(--cyan);border-color:rgba(34,228,255,.45)}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid rgba(164,107,255,.45);background:linear-gradient(90deg,rgba(164,107,255,.18),rgba(34,228,255,.08));font-size:14px}

/* ---------- home ---------- */
.home-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:560px){.home-hero{grid-template-columns:1fr;justify-items:center;text-align:center}.home-hero .row{justify-content:center}}
.ringwrap{position:relative;width:176px;height:176px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .rc .disp{font-size:34px;font-weight:600;line-height:1}
.ringwrap .rc small{font-size:12px;color:var(--mute);margin-top:6px}
.lvcard .lvnum{font-family:var(--f-disp);font-size:44px;font-weight:700;line-height:1;background:linear-gradient(180deg,#fff,#9fd9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.mission{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.mission:first-child{border-top:0}
.mcheck{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none}
.mission.done .mcheck{background:linear-gradient(135deg,var(--cyan),var(--violet));border:0;color:#04050b}
.mission.done .mt{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.3)}
.mission .mt{flex:1;min-width:0;font-size:14px}
.roomcard{display:block;text-decoration:none;color:inherit;overflow:hidden}
.roomcard .rv{margin:-6px -6px 0;border-radius:14px;background:radial-gradient(80% 80% at 50% 40%,rgba(61,123,255,.16),transparent 70%)}
.quote{font-size:15px;line-height:1.9}
.quote cite{display:block;font-style:normal;color:var(--mute);font-size:12px;margin-top:6px}

/* ---------- timer ---------- */
.tface{display:flex;flex-direction:column;align-items:center;gap:16px;padding:8px 0}
.tring{position:relative;width:min(300px,78vw);aspect-ratio:1;max-width:100%}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ttime{font-family:var(--f-disp);font-size:clamp(46px,14vw,68px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.03em;line-height:1;text-shadow:0 0 24px rgba(34,228,255,.35)}
.tphase{font-family:var(--f-disp);font-size:12px;letter-spacing:.24em;color:var(--cyan)}
.tphase.brk{color:var(--good)}
.tsubj{font-size:14px;color:var(--mute)}
.tctl{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.running .tring svg .prog{filter:drop-shadow(0 0 8px rgba(34,228,255,.8))}
.cheer{font-size:14px;color:var(--mute);text-align:center;min-height:1.6em;max-width:36ch}
.sounds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.snd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--mute);font-size:12.5px}
.snd.on{color:var(--ink);border-color:var(--cyan);background:rgba(34,228,255,.1);box-shadow:0 0 18px -6px rgba(34,228,255,.7)}
.snd .ic{width:24px;height:24px}
input[type=range]{width:100%;accent-color:var(--cyan)}

/* ---------- stats ---------- */
.chart svg{width:100%;height:auto;display:block}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:11px;color:var(--dim);text-align:center}
.cal .d{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:12px;font-family:var(--f-disp);color:var(--mute);background:rgba(255,255,255,.035);border:1px solid transparent;font-variant-numeric:tabular-nums}
.cal .d.l1{background:rgba(34,228,255,.12);color:var(--ink)}
.cal .d.l2{background:rgba(34,228,255,.26);color:var(--ink)}
.cal .d.l3{background:rgba(61,123,255,.45);color:#fff}
.cal .d.l4{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#04050b;font-weight:700;box-shadow:0 0 12px -2px rgba(34,228,255,.7)}
.cal .d.today{border-color:var(--cyan)}
.cal .d.x{visibility:hidden}
.legend{display:flex;flex-direction:column;gap:6px}
.legend .row{font-size:13px}

/* ---------- room ---------- */
.roomstage{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line-2);background:radial-gradient(70% 60% at 50% 45%,rgba(61,123,255,.18),transparent 70%),radial-gradient(60% 50% at 50% 100%,rgba(164,107,255,.16),transparent 70%),#05070f}
.roomstage svg{display:block;width:100%;height:auto;max-height:68vh;touch-action:manipulation}
.roomsvg [data-i]{cursor:pointer}
.roomsvg .tile{cursor:pointer}
.roomsvg .sel polygon,.roomsvg .sel rect{stroke:var(--cyan)!important;stroke-width:1.6!important;stroke-opacity:1!important}
.roomsvg .sel{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.78}}
.rb-head{display:flex;align-items:center;gap:6px;font-size:13px;padding:0 4px 7px;min-width:0}
.rb-head .ic{width:16px;height:16px;color:var(--cyan);flex:none}
.rb-head b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(52px,1fr));gap:6px}
.tool{user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;padding:4px 2px;border-radius:11px;border:1px solid var(--line);background:var(--glass-2);font-size:10.5px;line-height:1.2;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .1s,background .15s}
.tool .ic{width:18px;height:18px}
.tool:hover{background:rgba(130,165,255,.16)}
.tool:active{transform:scale(.94);background:rgba(34,228,255,.18)}
.tool.on{border-color:var(--cyan);color:var(--cyan);background:rgba(34,228,255,.1)}
.rb-move{display:flex;gap:8px;align-items:stretch}
.pad{display:grid;grid-template-columns:repeat(2,50px);grid-auto-rows:48px;gap:6px;flex:none}
.pad .tool{min-height:0}
.rb-move .rb-tools{flex:1;align-content:stretch}
.tool.go{border:0;background:linear-gradient(100deg,#19c9ff,#4b7dff 55%,#9a5cff);color:#04050b;font-weight:700;font-size:12px}
.tool:disabled{opacity:.35}
.tool.go.warn{background:linear-gradient(100deg,#ffb04d,#ff6f8f);color:#1a0610}
.pill.bad{color:#ff9fb1;border-color:rgba(255,92,122,.5)}
.roomsvg .ghost{filter:drop-shadow(0 0 5px rgba(34,228,255,.95))}
.roomsvg .ghost.bad{filter:drop-shadow(0 0 5px rgba(255,92,122,.95));opacity:.72}
.roombar{position:relative;margin:0 10px 10px;display:block;padding:8px;border-radius:14px;background:rgba(5,8,18,.85);border:1px solid var(--line-2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.roomtop{position:absolute;left:12px;top:12px;right:12px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between;pointer-events:none}
.roomtop>*{pointer-events:auto}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.item{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);min-width:0}
.item .thumb{height:86px;border-radius:10px;background:radial-gradient(70% 70% at 50% 50%,rgba(61,123,255,.14),transparent 70%);display:grid;place-items:center}
.item .thumb svg{max-height:86px;width:100%}
.item b{font-size:13px;font-weight:500}
.item .meta{font-size:11.5px;color:var(--mute);display:flex;justify-content:space-between;gap:6px}
.item.locked{opacity:.55}
.swatches{display:flex;gap:8px;flex-wrap:wrap}

let statCache = {v: -1, val: null};
function goalFor(k){
  const prev = addDays(k, -1), rv = data.months[monthOf(prev)]?.reviews?.[prev];
  return (rv && rv.tg > 0) ? rv.tg : (S().dailyGoal || 0);
}
function allSessions(){ return Object.values(data.months).flatMap(m => m.sessions); }
function stats(){
  if (statCache.v === dataV && statCache.val) return statCache.val;
  const ss = allSessions(), today = dkey();
  const byDay = {}, subjDay = {}, subjects = new Set();
  let total = 0, maxSession = 0, early = false;
  for (const s of ss) {
    byDay[s.d] = (byDay[s.d] || 0) + s.m; total += s.m; subjects.add(s.s);
    (subjDay[s.d] ||= {})[s.s] = (subjDay[s.d][s.s] || 0) + s.m;
    if (s.m > maxSession) maxSession = s.m;
    if (new Date(s.t).getHours() < 7) early = true;
  }
  const studied = k => (byDay[k] || 0) >= STREAK_MIN;
  let streak = 0, k = studied(today) ? today : addDays(today, -1);
  while (studied(k)) { streak++; k = addDays(k, -1); }
  const days = Object.keys(byDay).filter(studied).sort();
  let best = 0, run = 0, prev = null;
  for (const d of days) { run = (prev && addDays(prev, 1) === d) ? run + 1 : 1; best = Math.max(best, run); prev = d; }
  let goalDays = 0; for (const d of Object.keys(byDay)) { const g = goalFor(d); if (g > 0 && byDay[d] >= g) goalDays++; }
  let reviews = 0; for (const m of Object.values(data.months)) reviews += Object.values(m.reviews).filter(r => r && (r.did || r.tomorrow)).length;
  const ws = weekStart(today), mk = monthOf(today);
  let weekMin = 0, monthMin = 0;
  for (const d in byDay) { if (d >= ws && d <= today) weekMin += byDay[d]; if (monthOf(d) === mk) monthMin += byDay[d]; }
  const level = levelFromXp(total);
  const st = S();
  const coins = total + (st.bonus || 0) - (st.spent || 0);
  const val = {sessions: ss, count: ss.length, byDay, subjDay, total, xp: total, level, coins, streak, best: Math.max(best, streak), maxSession, early,
    goalDays, reviews, subjUsed: subjects.size, weekMin, monthMin, today: byDay[today] || 0, placed: st.room.items.length};
  statCache = {v: dataV, val};
  return val;
}
function todayInfo(){
  const x = stats(), today = dkey();
  const ss = x.sessions.filter(s => s.d === today);
  const rv = data.months[monthOf(today)]?.reviews?.[today];
  return { total: x.today, goal: goalFor(today), maxSession: ss.reduce((a, s) => Math.max(a, s.m), 0), subjCount: new Set(ss.map(s => s.s)).size,

}

let T = LS.get('sh-timer') || {mode: 'cd', target: 25, subj: 'en', state: 'idle', acc: 0, since: null, phase: 'study', brk: 5, startAt: null, cheer: ''};
let tickId = null, wakeLock = null;
const saveTimer = () => LS.set('sh-timer', T);
const elapsed = () => T.acc + (T.since ? Date.now() - T.since : 0);
function restoreTimer(){ if (T.state === 'run' || T.state === 'pause') { startTick(); if (T.state === 'run') requestWake(); } }
function startTick(){ if (!tickId) tickId = setInterval(tick, 250); }
function stopTick(){ clearInterval(tickId); tickId = null; }
async function requestWake(){ try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
function releaseWake(){ try { wakeLock && wakeLock.release(); } catch {} wakeLock = null; }
function tick(){
  if (T.state === 'run') {
    const el = elapsed();
    if (T.phase === 'break' && el >= T.brk * 60000) { endBreak(); return; }
    if (T.phase === 'study' && T.mode === 'cd' && el >= T.target * 60000) { finishStudy(true); return; }
    if (T.phase === 'study' && el >= MAX_SESSION_MS) { finishStudy(true); return; }
  }
  updateTimerUI();
}
function fmtClock(ms){ const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return h ? `${h}:${pad2(m)}:${pad2(ss)}` : `${pad2(m)}:${pad2(ss)}`; }
function updateTimerUI(){
  const tt = $('#t-time'); if (!tt) return;
  const el = elapsed(), isBrk = T.phase === 'break';
  let show, pct;
  if (isBrk) { const tg = T.brk * 60000; show = tg - el; pct = 1 - el / tg; }
  else if (T.mode === 'cd') { const tg = T.target * 60000; show = tg - el; pct = el / tg; }
  else { show = el; pct = (el % 3600000) / 3600000; }
  tt.textContent = fmtClock(show);
  const ring = $('#t-ring .prog');
  if (ring) { const r = +ring.getAttribute('r'), c = 2 * Math.PI * r; ring.setAttribute('stroke-dasharray', `${(c * clamp(pct, 0, 1)).toFixed(1)} ${c.toFixed(1)}`); }
  const xp = $('#t-xp'); if (xp) xp.textContent = isBrk ? '休憩中は記録されません' : `いまの獲得予定 +${Math.floor(Math.min(el, T.mode === 'cd' ? T.target * 60000 : MAX_SESSION_MS) / 60000)} XP`;
}
function timerStart(){
  if (T.mode === 'cd' && !(T.target >= 1)) { toast('時間を1分以上に設定してください。', 'x'); return; }
  if (!S().subjects.find(s => s.id === T.subj && !s.hidden)) T.subj = S().subjects.find(s => !s.hidden)?.id || 'ot';
  Object.assign(T, {state: 'run', acc: 0, since: Date.now(), phase: 'study', startAt: Date.now(), cheer: CHEER_START[Math.floor(Math.random() * CHEER_START.length)]});
  saveTimer(); startTick(); requestWake(); AudioEng.ensure();
  render();
}
function timerPause(){ if (T.state !== 'run') return; T.acc = elapsed(); T.since = null; T.state = 'pause'; saveTimer(); releaseWake(); render(); }
function timerResume(){ if (T.state !== 'pause') return; T.since = Date.now(); T.state = 'run'; saveTimer(); requestWake(); render(); }
function timerReset(){ Object.assign(T, {state: 'idle', acc: 0, since: null, phase: 'study', startAt: null}); saveTimer(); stopTick(); releaseWake(); render(); }
function finishStudy(auto){
  if (T.phase !== 'study') { endBreak(); return; }
  const cap = T.mode === 'cd' ? T.target * 60000 : MAX_SESSION_MS;
  const el = Math.min(elapsed(), cap), min = Math.floor(el / 60000);
  const startAt = T.startAt || (Date.now() - el), subj = T.subj, mode = T.mode;
  Object.assign(T, {state: 'idle', acc: 0, since: null, startAt: null}); saveTimer(); stopTick(); releaseWake();
  if (S().prefs.stopSound) AudioEng.stop();
  AudioEng.chime();
  if (min < 1) { toast('1分未満の勉強は記録されません。', 'timer'); render(); return; }
  const startDate = new Date(startAt);
  addSession({id: uid6(), d: dkey(startDate), t: startAt, s: subj, m: min, k: mode});
  if (auto && T.brk > 0) { Object.assign(T, {state: 'run', phase: 'break', acc: 0, since: Date.now()}); saveTimer(); startTick(); }
  render();
}
function endBreak(){ Object.assign(T, {state: 'idle', phase: 'study', acc: 0, since: null}); saveTimer(); stopTick(); AudioEng.chime(); toast('休憩おわり。準備ができたら次のセッションへ。', 'timer'); render(); }

  `;
};
const nowHM = () => { const d = new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };

          <label class="row" style="gap:6px;font-size:13px;color:var(--mute)">自由に<input id="t-custom" type="number" min="1" max="600" inputmode="numeric" value="${T.target}" style="width:84px" ${idle ? '' : 'disabled'}>分</label></div>` : '<p class="note" style="margin:12px 0 0">終了ボタンを押すまで計測します（最長12時間）。</p>'}

VIEWS.stats = () => {
  const st = S(), x = stats(), today = dkey(), mode = UI.statMode;
  let cols = [], goal = 0, rangeLabel = '';
  const subs = st.subjects;
  if (mode === 'day') {
    for (let i = 6; i >= 0; i--) { const k = addDays(today, -i), sd = x.subjDay[k] || {};
      cols.push({label: i === 0 ? '今日' : `${parseD(k).getDate()}${WD[parseD(k).getDay()]}`, hl: i === 0, segs: subs.map(s => ({v: sd[s.id] || 0, c: s.color})).concat(Object.keys(sd).filter(id => !subs.find(s => s.id === id)).map(id => ({v: sd[id], c: '#9aa3c0'})))}); }
    goal = st.dailyGoal; rangeLabel = '直近7日';
  } else if (mode === 'week') {
    const ws = weekStart(today);
    for (let i = 7; i >= 0; i--) { const w0 = addDays(ws, -7 * i); let v = 0; for (let j = 0; j < 7; j++) v += x.byDay[addDays(w0, j)] || 0;
      cols.push({label: fmtMD(w0), hl: i === 0, segs: [{v, c: i === 0 ? '#22e4ff' : '#3d7bff'}]}); }
    goal = st.dailyGoal * 7; rangeLabel = '直近8週（週の始まり＝月曜）';
  } else {
    const mk = monthOf(today);
    for (let i = 5; i >= 0; i--) { const m = addMonths(mk, -i); let v = 0; for (const d in x.byDay) if (monthOf(d) === m) v += x.byDay[d];
      cols.push({label: `${+m.slice(5)}月`, hl: i === 0, segs: [{v, c: i === 0 ? '#a46bff' : '#6b5bd6'}]}); }
    goal = st.dailyGoal * daysInMonth(mk); rangeLabel = '直近6か月';
  }
  const totals = cols.map(c => c.segs.reduce((a, s) => a + s.v, 0)), sum = totals.reduce((a, b) => a + b, 0);
  const avg = mode === 'day' ? sum / 7 : sum / cols.length;
  // donut
  let from = '0000', lbl = '全期間';
  if (UI.donut === 'week') { from = weekStart(today); lbl = '今週'; } else if (UI.donut === 'month') { from = monthOf(today) + '-01'; lbl = '今月'; }
  const per = {}; for (const s of x.sessions) if (s.d >= from) per[s.s] = (per[s.s] || 0) + s.m;
  const items = Object.entries(per).map(([id, v]) => ({id, v, c: subjOf(id).color, n: subjOf(id).name})).sort((a, b) => b.v - a.v);
  const dtot = items.reduce((a, i) => a + i.v, 0);
  // calendar
  const cm = UI.calMonth, first = parseD(cm + '-01'), lead = (first.getDay() + 6) % 7, nd = daysInMonth(cm);
  let cal = ['月','火','水','木','金','土','日'].map(w => `<span class="h">${w}</span>`).join('');
  for (let i = 0; i < lead; i++) cal += '<span class="d x"></span>';
  let studiedDays = 0, goalDaysM = 0, elapsedDays = 0;
  for (let d = 1; d <= nd; d++) { const k = `${cm}-${pad2(d)}`, v = x.byDay[k] || 0, g = goalFor(k), r = g ? v / g : 0;
    if (k <= today) elapsedDays++; if (v >= STREAK_MIN) studiedDays++; if (g && v >= g) goalDaysM++;
    const lvl = v < STREAK_MIN ? 0 : r >= 1 ? 4 : r >= .5 ? 3 : r >= .25 ? 2 : 1;
    cal += `<span class="d ${lvl ? 'l' + lvl : ''} ${k === today ? 'today' : ''}" title="${fmtMD(k)} ${fmtHM(v)}">${d}</span>`; }
  const recent = x.sessions.slice().sort((a, b) => b.t - a.t).slice(0, 40);
  return `<div class="pagehead"><h1>記録・分析</h1><div class="seg">${[['day','日別'],['week','週別'],['month','月別']].map(([k, n]) => `<button data-act="stat-mode" data-v="${k}" class="${mode === k ? 'on' : ''}">${n}</button>`).join('')}</div></div>
  <div class="grid3">
    <section class="panel"><div class="kv"><span class="k">累計勉強時間</span><span class="v">${hmParts(x.total)[0]}<small>時間</small>${hmParts(x.total)[1]}<small>分</small></span></div></section>
    <section class="panel"><div class="kv"><span class="k">今週 / 今月</span><span class="v">${(x.weekMin / 60).toFixed(1)}<small>h</small> <span class="dim">/</span> ${(x.monthMin / 60).toFixed(1)}<small>h</small></span></div></section>
    <section class="panel"><div class="kv"><span class="k">${mode === 'day' ? '1日' : mode === 'week' ? '1週' : '1か月'}の平均と目標</span><span class="v">${fmtHM(avg)}</span></div><p class="note" style="margin:4px 0 0">目標 ${fmtHM(goal)} に対して ${goal ? Math.round(avg / goal * 100) : 0}%</p></section>
  </div>
  <section class="panel chart"><div class="ph"><div><span class="eyebrow">${rangeLabel}</span><h2>勉強時間の推移</h2></div><span class="pill warn">点線＝目標</span></div>${barChart(cols, goal)}
    ${mode === 'day' ? `<div class="chips" style="margin-top:10px">${subs.filter(s => cols.some(c => c.segs.find(g => g.c === s.color && g.v > 0))).map(s => `<span class="chip" style="--c:${s.color}"><i></i>${esc(s.name)}</span>`).join('')}</div>` : ''}</section>
  <div class="grid2">
    <section class="panel"><div class="ph"><h2>科目別の割合</h2><div class="seg">${[['week','今週'],['month','今月'],['all','全期間']].map(([k, n]) => `<button data-act="donut" data-v="${k}" class="${UI.donut === k ? 'on' : ''}">${n}</button>`).join('')}</div></div>
      <div class="row" style="align-items:center;gap:18px;flex-wrap:wrap"><div style="width:150px;flex:none">${donut(items)}</div>
      <div class="legend" style="flex:1;min-width:150px">${items.length ? items.map(i => `<div class="row"><span class="dot" style="--c:${i.c}"></span><span style="flex:1">${esc(i.n)}</span><span class="disp mute">${fmtHM(i.v)}</span><span class="disp" style="width:42px;text-align:right">${Math.round(i.v / dtot * 100)}%</span></div>`).join('') : `<p class="note">${lbl}の記録はまだありません。</p>`}</div></div></section>
    <section class="panel"><div class="ph"><div><span class="eyebrow">STREAK</span><h2>連続勉強記録</h2></div><div class="row" style="gap:4px"><button class="btn sm ghost" data-act="cal" data-v="-1" aria-label="前の月">${icon('chevL')}</button><b class="disp" style="font-size:14px">${cm.replace('-', '.')}</b><button class="btn sm ghost" data-act="cal" data-v="1" aria-label="次の月">${icon('chevR')}</button></div></div>
      <div class="row wrap" style="gap:16px;margin-bottom:12px"><div class="kv"><span class="k">現在</span><span class="v" style="font-size:18px;color:#ffb067">${x.streak}<small>日</small></span></div><div class="kv"><span class="k">最長</span><span class="v" style="font-size:18px">${x.best}<small>日</small></span></div><div class="kv"><span class="k">月間達成率</span><span class="v" style="font-size:18px">${elapsedDays ? Math.round(studiedDays / elapsedDays * 100) : 0}<small>%</small></span></div><div class="kv"><span class="k">目標達成日</span><span class="v" style="font-size:18px">${goalDaysM}<small>日</small></span></div></div>
      <div class="cal">${cal}</div><p class="note" style="margin:10px 0 0">色が濃いほど目標に近い日。グラデーションは目標達成日です。月間達成率＝その月の経過日数のうち勉強した日の割合。</p></section>
  </div>
  <section class="panel"><div class="ph"><h2>過去の勉強記録</h2><span class="note">最新40件</span></div>
    ${recent.length ? `<div class="list">${recent.map(s => { const sj = subjOf(s.s), t = new Date(s.t); const conf = UI.histConfirm === s.id;
      return `<div class="li"><span class="dot" style="--c:${sj.color}"></span><div class="t"><b>${esc(sj.name)}</b><span>${fmtMD(s.d)}（${WD[parseD(s.d).getDay()]}）${pad2(t.getHours())}:${pad2(t.getMinutes())}〜 · ${s.k === 'sw' ? 'ストップウォッチ' : 'カウントダウン'}</span></div><span class="disp">${fmtHM(s.m)}</span>
      ${conf ? `<button class="btn sm danger" data-act="hist-del" data-v="${s.id}" data-m="${monthOf(s.d)}">削除する</button><button class="btn sm ghost" data-act="hist-cancel">戻す</button>` : `<button class="btn sm ghost" data-act="hist-ask" data-v="${s.id}" aria-label="この記録を削除">${icon('trash')}</button>`}</div>`; }).join('')}</div>` : '<div class="empty">まだ記録がありません。タイマーで勉強すると、ここに自動で残ります。</div>'}
    <p class="note" style="margin:10px 0 0">記録を削除すると、その分の経験値とコインも減ります。</p></section>`;
};

VIEWS.room = () => {
  const st = S(), x = stats(), stg = stageFor(x.level), N = STAGES[stg].size, nextS = STAGES[stg + 1];
  const selIt = st.room.items.find(i => i.id === UI.sel);
  const placedCount = t => st.room.items.filter(i => i.t === t).length;
  const inv = F_ORDER.filter(t => (st.owned[t] || 0) - placedCount(t) > 0);
  let bar = '';
  if (UI.place) { const pd = F[UI.place.t], ok = placeOk(UI.place), arr = (deg, v, lbl) => `<button class="tool" data-act="rm-nudge" data-v="${v}" aria-label="${lbl}"><span style="display:inline-flex;transform:rotate(${deg}deg)">${icon('arrow')}</span></button>`;
    bar = `<div class="roombar"><div class="rb-head">${icon('move')}<b>${esc(pd.n)}</b><span class="sp"></span><span class="pill ${ok ? 'good' : 'bad'}">${ok ? 'ここに置けます' : 'ぶつかっています'}</span></div>
      <div class="rb-move"><div class="pad">${pd.wall ? arr(-90, 'wl', '左へ') + arr(90, 'wr', '右へ') : arr(-45, 'xm', '左上へ') + arr(45, 'ym', '右上へ') + arr(-135, 'yp', '左下へ') + arr(135, 'xp', '右下へ')}</div>
      <div class="rb-tools">${!pd.wall ? `<button class="tool" data-act="rm-rot-place">${icon('rotate')}向き</button>` : ''}<button class="tool" data-act="rm-cancel">${icon('x')}やめる</button><button class="tool go ${ok ? '' : 'warn'}" data-act="rm-ok">${ok ? icon('check') + 'ここに置く' : icon('move') + '空いている所へ'}</button></div></div>
      <p class="note" style="margin:6px 4px 0">矢印で1マスずつ動かせます。床をタップしてもその場所へ移動します。<span class="dim"> ver.7</span></p></div>`; }
  else if (selIt) { const d = F[selIt.t];
    bar = `<div class="roombar"><div class="rb-head"><b>${esc(d.n)}</b></div>
      <div class="rb-tools"><button class="tool" data-act="rm-move">${icon('move')}移動</button>${!d.wall ? `<button class="tool" data-act="rm-rot">${icon('rotate')}回転</button>` : ''}<button class="tool ${UI.colorOpen ? 'on' : ''}" data-act="rm-color" aria-pressed="${!!UI.colorOpen}">${icon('palette')}色</button><button class="tool" data-act="rm-store">${icon('box')}しまう</button><button class="tool" data-act="rm-desel">${icon('x')}閉じる</button></div>
      ${UI.colorOpen ? `<div class="swatches" style="margin-top:8px;padding:0 2px">${d.colors.map((c, i) => `<button class="sw ${(selIt.c || 0) === i ? 'on' : ''}" style="--c:${c}" data-act="rm-setc" data-v="${i}" aria-label="色${i + 1}"></button>`).join('')}</div>` : ''}</div>`; }
  const tabs = [['inv','持ち物'],['shop','ショップ'],['deco','壁紙・床'],['log','成長記録']];
  let panel = '';
  if (UI.roomTab === 'inv') panel = inv.length ? `<div class="shop">${inv.map(t => `<div class="item"><div class="thumb">${thumbSVG(t)}</div><b>${esc(F[t].n)}</b><div class="meta"><span>残り ${(st.owned[t] || 0) - placedCount(t)}個</span></div><button class="btn sm primary" data-act="rm-place" data-v="${t}">置く</button></div>`).join('')}</div>`
      : `<div class="empty">しまってある家具はありません。<br>ショップで家具を手に入れるか、部屋の家具をタップして「しまう」とここに戻ります。</div>`;
  if (UI.roomTab === 'shop') panel = `<p class="note" style="margin:0 0 10px">勉強1分＝1コイン。レベルが上がると新しい家具が解放されます。所持コイン <b class="disp" style="color:var(--warn)">${Math.max(0, x.coins).toLocaleString()}</b></p><div class="shop">${F_ORDER.map(t => { const d = F[t], lock = x.level < d.lv, own = st.owned[t] || 0;
      return `<div class="item ${lock ? 'locked' : ''}"><div class="thumb">${lock ? icon('lock') : thumbSVG(t)}</div><b>${esc(d.n)}</b><div class="meta"><span>${lock ? `LV${d.lv}で解放` : own ? `所持 ${own}` : '未所持'}</span><span class="disp">${d.cost ? d.cost + 'c' : '無料'}</span></div>
        <button class="btn sm ${lock ? '' : 'primary'}" data-act="rm-buy" data-v="${t}" ${lock || x.coins < d.cost ? 'disabled' : ''}>${lock ? 'ロック中' : x.coins < d.cost ? 'コイン不足' : own ? 'もう1つ買う' : '購入する'}</button></div>`; }).join('')}</div>`;
  if (UI.roomTab === 'deco') panel = `<h3 style="margin:0 0 8px;font-size:14px">壁紙</h3><div class="themes">${Object.entries(WALLS).map(([k, w]) => `<button class="theme ${st.room.wall === k ? 'on' : ''}" data-act="rm-wall" data-v="${k}" ${x.level < w.lv ? 'disabled' : ''}><i style="--c:${k === 'aurora' ? 'linear-gradient(135deg,#1d2a6b,#3b1f6e,#0f3a4a)' : w.c}"></i>${esc(w.n)}${x.level < w.lv ? ` · LV${w.lv}` : ''}</button>`).join('')}</div>
      <h3 style="margin:16px 0 8px;font-size:14px">床</h3><div class="themes">${Object.entries(FLOORS).map(([k, f]) => `<button class="theme ${st.room.floor === k ? 'on' : ''}" data-act="rm-floor" data-v="${k}" ${x.level < f.lv ? 'disabled' : ''}><i style="--c:${f.c}"></i>${esc(f.n)}${x.level < f.lv ? ` · LV${f.lv}` : ''}</button>`).join('')}</div>`;
  if (UI.roomTab === 'log') panel = `<div class="timeline">${STAGES.map((s, i) => { const log = st.roomLog.find(r => r.stage === i); return `<div class="tl ${i > stg ? 'lock' : ''}"><b>LEVEL ${i + 1}：${esc(s.name)}</b><div class="note">${log ? `${fmtDate(log.date)}に到達` : `プレイヤーLV${s.lv}で解放`} · 広さ ${s.size}×${s.size}</div></div>`; }).join('')}</div>`;
  return `<div class="pagehead"><div><span class="eyebrow">ROOM LEVEL ${stg + 1} / ${STAGES.length}</span><h1>${esc(STAGES[stg].name)}</h1></div>
    <div style="min-width:200px;flex:1;max-width:320px">${nextS ? `<div class="row" style="justify-content:space-between;font-size:12px"><span class="mute">次の部屋まで</span><span class="disp">LV${x.level} → LV${nextS.lv}</span></div><div class="bar" style="margin-top:6px"><i style="width:${clamp((x.xp - xpForLevel(STAGES[stg].lv)) / (xpForLevel(nextS.lv) - xpForLevel(STAGES[stg].lv)) * 100, 0, 100).toFixed(1)}%"></i></div>` : '<span class="pill good">最終段階に到達</span>'}</div></div>
  <div class="roomstage" id="roomstage">${roomSVG(st.room, N, {sel: UI.sel, place: UI.place})}

  <section class="panel"><div class="seg" style="margin-bottom:14px">${tabs.map(([k, n]) => `<button data-act="rm-tab" data-v="${k}" class="${UI.roomTab === k ? 'on' : ''}">${n}</button>`).join('')}</div>${panel}</section>`;
};

VIEWS.rank = () => {
  const st = S(), x = stats(), today = dkey(), wk = weekStart(today), mo = monthOf(today);
  if (MODE !== 'cloud') return `<div class="pagehead"><h1>ランキング</h1></div><section class="panel"><div class="empty">${icon('users')}<br>ランキングと友達機能は、ログインして使えます。<br>今はこの端末だけに記録しています（config.js の設定を確認してください）。</div></section>`;
  const val = d => UI.rankPeriod === 'week' ? (d.wk === wk ? d.wMin || 0 : 0) : UI.rankPeriod === 'month' ? (d.mo === mo ? d.mMin || 0 : 0) : (d.tot || 0);
  let pool = pubDocs.filter(d => d.code && d.uid !== UID); const mine = buildPub(); if (mine) pool.push({uid: UID, ...mine});
  if (UI.rankScope === 'friends') pool = pool.filter(d => d.uid === UID || st.friends.includes(d.code) || (Array.isArray(d.fr) && d.fr.includes(st.code)));
  if (UI.rankScope === 'group') pool = st.group ? pool.filter(d => d.group === st.group) : [];
  const rows = pool.map(d => ({...d, v: val(d)})).sort((a, b) => b.v - a.v || (b.lv || 0) - (a.lv || 0));
  const meIn = rows.some(r => r.uid === UID);
  const avColor = id => ['#22e4ff','#a46bff','#3d7bff','#3ee6a0','#ffc24d','#ff6fb0','#ff9350'][hashStr(id) % 7];
  return `<div class="pagehead"><h1>ランキング</h1><div class="seg">${[['week','週間'],['month','月間'],['total','累計']].map(([k, n]) => `<button data-act="rank-p" data-v="${k}" class="${UI.rankPeriod === k ? 'on' : ''}">${n}</button>`).join('')}</div></div>
  <div class="grid2">
    <section class="panel"><div class="ph"><div class="seg">${[['friends','友達'],['group','グループ'],['all','全員']].map(([k, n]) => `<button data-act="rank-s" data-v="${k}" class="${UI.rankScope === k ? 'on' : ''}">${n}</button>`).join('')}</div><span class="note">${UI.rankPeriod === 'week' ? '月曜はじまり' : UI.rankPeriod === 'month' ? `${+mo.slice(5)}月` : '全期間'}</span></div>
      ${!st.privacy.share ? '<p class="banner" style="margin:0 0 10px">ランキング参加がオフです。自分は表示されません（下の設定で変更できます）。</p>' : ''}
      ${UI.rankScope === 'group' && !st.group ? '<div class="empty">グループに参加すると、同じグループの人だけのランキングが見られます。</div>' :
        rows.length ? `<div>${rows.map((r, i) => `<div class="rk ${i < 3 && r.v > 0 ? 'top' + (i + 1) : ''} ${r.uid === UID ? 'me' : ''}"><span class="n">${i + 1}</span><span class="av" style="--c:${avColor(r.uid)}">${esc((r.nick || '?').slice(0, 1))}</span>
          <div style="flex:1;min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.nick || 'ななしの受験生')}${r.uid === UID ? '（あなた）' : ''}</b><span class="note">LV${r.lv || 1} · ${esc(titleFor(r.lv || 1))} · 連続${r.streak || 0}日</span></div>
          <span class="disp" style="font-size:16px">${fmtHM(r.v)}</span>${r.room && r.uid !== UID ? `<button class="btn sm ghost" data-act="see-room" data-v="${esc(r.uid)}" aria-label="部屋を見る">${icon('eye')}</button>` : ''}</div>`).join('')}</div>`
        : `<div class="empty">${UI.rankScope === 'friends' ? 'まだ友達がいません。右の「友達を追加」から、友達のコードを登録しよう。' : 'まだ参加者がいません。'}</div>`}
      ${st.privacy.share && !meIn && UI.rankScope !== 'group' ? '<p class="note">あなたのデータを反映中です…</p>' : ''}
    </section>
    <div class="stack">
      <section class="panel hero"><div class="ph"><div><span class="eyebrow">INVITE</span><h3>友達を招待する</h3></div></div>
        <p class="note" style="margin:0 0 12px">招待リンクから登録した友達とは、自動でお互いのランキングに表示されます。</p>
        <div class="row wrap" style="gap:8px"><button class="btn primary" data-act="invite">${icon('users')}招待リンクを送る</button><button class="btn" data-act="invite-copy">${icon('copy')}リンクをコピー</button></div></section>
      <section class="panel"><div class="ph"><h3>あなたのフレンドコード</h3></div><div class="row"><span class="code" id="mycode">${esc(st.code)}</span><span class="sp"></span><button class="btn sm" data-act="copy-code">${icon('copy')}コピー</button></div>
        <p class="note" style="margin:8px 0 0">どちらか一方がコードを登録すれば、お互いの「友達」ランキングに表示されます。</p></section>
      <section class="panel"><div class="ph"><h3>友達を追加</h3></div><form class="row" data-form="add-friend"><input id="fr-code" type="text" maxlength="6" placeholder="例：K7QX2M" autocomplete="off" style="text-transform:uppercase"><button class="btn primary" type="submit">${icon('plus')}追加</button></form>
        ${st.friends.length ? `<div class="list" style="margin-top:10px">${st.friends.map(c => { const d = pubDocs.find(p => p.code === c); return `<div class="li"><span class="disp" style="letter-spacing:.15em">${esc(c)}</span><div class="t"><b>${d ? esc(d.nick || 'ななしの受験生') : '見つかりません'}</b><span>${d ? `LV${d.lv}` : 'ランキング参加をオフにしている可能性があります'}</span></div><button class="btn sm ghost" data-act="fr-del" data-v="${esc(c)}" aria-label="友達を削除">${icon('x')}</button></div>`; }).join('')}</div>` : ''}</section>
      <section class="panel"><div class="ph"><h3>グループ</h3>${st.group ? `<span class="pill cy">${esc(st.group)}</span>` : ''}</div><form class="row" data-form="group"><input id="grp" type="text" maxlength="12" placeholder="例：KOBE3A" value="${esc(st.group)}" autocomplete="off" style="text-transform:uppercase"><button class="btn" type="submit">${st.group ? '変更' : '参加'}</button></form>
        <p class="note" style="margin:8px 0 0">同じグループ名を入れた人どうしでランキングになります。クラスや塾の仲間と決めてください。空欄で保存すると退出します。</p></section>
      <section class="panel"><div class="ph"><h3>公開する情報</h3></div>
        <div class="row" style="margin-bottom:12px"><span style="flex:1;font-size:14px">ランキングに参加する<br><span class="note">ニックネーム・レベル・勉強時間・連続日数</span></span><button class="tog ${st.privacy.share ? 'on' : ''}" data-act="priv" data-k="share" aria-pressed="${st.privacy.share}" aria-label="ランキングに参加する"></button></div>
        <div class="row"><span style="flex:1;font-size:14px">勉強部屋を公開する</span><button class="tog ${st.privacy.room ? 'on' : ''}" data-act="priv" data-k="room" aria-pressed="${st.privacy.room}" aria-label="勉強部屋を公開する" ${st.privacy.share ? '' : 'disabled'}></button></div>
        <p class="note" style="margin:10px 0 0">科目の内訳・振り返りの文章・志望校は公開されません。</p></section>
    </div>
  </div>`;

      <form class="row wrap" data-form="tg-add" style="margin-top:12px;gap:8px"><input id="tg-univ" type="text" placeholder="大学名" maxlength="30" style="flex:1;min-width:130px" aria-label="大学名"><input id="tg-fac" type="text" placeholder="学部・学科" maxlength="30" style="flex:1;min-width:130px" aria-label="学部"><button class="btn primary" type="submit">${icon('plus')}追加</button></form>

function liveCountdown(date){
  const ms = parseD(date) - Date.now(); if (ms <= 0) return '試験当日';
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return `${d}<span style="font-size:.45em;color:var(--mute)">日</span> ${pad2(h)}:${pad2(m)}:${pad2(ss)}`;
}

VIEWS.review = () => {
  const st = S(), x = stats(), today = dkey(), info = todayInfo(), mk = monthOf(today);
  const rv = data.months[mk]?.reviews?.[today] || {};
  const per = {}; for (const s of info.sessions) per[s.s] = (per[s.s] || 0) + s.m;
  const items = Object.entries(per).sort((a, b) => b[1] - a[1]);
  const pct = info.goal ? info.total / info.goal : 0;
  const draft = UI.review || {did: rv.did || '', tomorrow: rv.tomorrow || '', tg: rv.tg || st.dailyGoal};
  const past = Object.values(data.months).flatMap(m => Object.entries(m.reviews)).filter(([k, r]) => k !== today && r && (r.did || r.tomorrow)).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 10);
  return `<div class="pagehead"><div><span class="eyebrow">NIGHT REVIEW · ${fmtMD(today)}</span><h1>今日の振り返り</h1></div><span class="pill ${info.reviewed ? 'good' : ''}">${info.reviewed ? '記入済み' : '未記入'}</span></div>

    <section class="panel"><div class="kv"><span class="k">獲得経験値 / 連続記録</span><span class="v">+${info.total}<small>XP</small> · ${x.streak}<small>日</small></span></div></section>
  </div>
  <div class="grid2">
    <section class="panel"><div class="ph"><h2>科目別</h2></div>${items.length ? `<div class="legend">${items.map(([id, v]) => `<div class="row"><span class="dot" style="--c:${subjOf(id).color}"></span><span style="flex:1">${esc(subjOf(id).name)}</span><div class="bar" style="flex:2"><i style="width:${(v / items[0][1] * 100).toFixed(0)}%;background:${subjOf(id).color};box-shadow:none"></i></div><span class="disp" style="width:70px;text-align:right">${fmtHM(v)}</span></div>`).join('')}</div>` : '<div class="empty">今日はまだ記録がありません。5分だけでも、記録をつなげてみよう。</div>'}</section>

      <label class="fld" for="rv-tom">明日の目標<textarea id="rv-tom" maxlength="400" placeholder="例：英単語100個、数学は絶対値の不等式を5問">${esc(draft.tomorrow)}</textarea></label>
      <label class="fld" for="rv-tg">明日の目標時間（分）<input id="rv-tg" type="number" min="0" max="1200" step="10" inputmode="numeric" value="${draft.tg}"></label>
      <button class="btn primary" type="submit">${icon('check')}振り返りを保存</button></form>
  </div>
  <section class="panel"><div class="ph"><div><h2>振り返りの通知</h2></div></div>

    <path d="M30 3 53 16v28L30 57 7 44V16z" fill="url(#bg${b.id})" stroke="${mix(b.c, '#ffffff', .4)}" stroke-width="1.5" style="${on ? `filter:drop-shadow(0 0 6px ${b.c})` : ''}"/>
    <path d="M30 13 34 24 46 24 36.5 31 40 43 30 36 20 43 23.5 31 14 24 26 24z" fill="rgba(255,255,255,.88)"/></svg>`;
}

/* ---------- room placement: candidate position + arrows + tap ---------- */
function placeOk(pl){
  const items = S().room.items, N = roomN();
  return F[pl.t].wall ? canPlaceWall(items, N, pl.t, pl.side, pl.x, pl.moveId) : canPlace(items, N, pl.t, pl.x, pl.y, pl.r || 0, pl.moveId);
}
function placeDims(pl){ const d = F[pl.t]; return (pl.r % 2) ? [d.D, d.W] : [d.W, d.D]; }
function clampPlace(pl){
  const N = roomN(), d = F[pl.t];
  if (d.wall) { pl.x = clamp(pl.x, 0, N - d.W); return; }
  const [w, dd] = placeDims(pl); pl.x = clamp(pl.x, 0, N - w); pl.y = clamp(pl.y, 0, N - dd);
}
function initPlace(t){
  const d = F[t], items = S().room.items, N = roomN();
  if (d.wall) { for (const side of ['R', 'L']) for (let p = 0; p + d.W <= N; p++) if (canPlaceWall(items, N, t, side, p)) return {t, side, x: p, y: 0, r: 0};
    return {t, side: 'R', x: 0, y: 0, r: 0}; }
  const cands = []; for (let ax = 0; ax + d.W <= N; ax++) for (let ay = 0; ay + d.D <= N; ay++) cands.push({ax, ay, dist: (ax + d.W / 2 - N / 2) ** 2 + (ay + d.D / 2 - N / 2) ** 2});
  cands.sort((p, q) => p.dist - q.dist);
  const f = cands.find(q => canPlace(items, N, t, q.ax, q.ay, 0));
  return {t, r: 0, x: f ? f.ax : 0, y: f ? f.ay : 0};
}
function nudgePlace(dir){
  const pl = UI.place; if (!pl) return; const N = roomN(), d = F[pl.t];
  if (d.wall) {
    if (dir === 'wr') { if (pl.side === 'R') { if (pl.x + 1 + d.W <= N) pl.x++; } else { if (pl.x + 1 + d.W <= N) pl.x++; else { pl.side = 'R'; pl.x = 0; } } }
    if (dir === 'wl') { if (pl.side === 'R') { if (pl.x - 1 >= 0) pl.x--; else { pl.side = 'L'; pl.x = N - d.W; } } else if (pl.x - 1 >= 0) pl.x--; }
  } else {
    if (dir === 'xm') pl.x--; if (dir === 'xp') pl.x++; if (dir === 'ym') pl.y--; if (dir === 'yp') pl.y++;
    clampPlace(pl);
  }
  render();
}
function commitPlace(){
  const pl = UI.place; if (!pl) return;
  if (!placeOk(pl)) {
    if (snapToFree(pl)) { render(); toast('近くの空いている場所に動かしました。よければ「ここに置く」を押してください。', 'move', 3800); }
    else toast('部屋に空きがありません。ほかの家具をしまってから置いてください。', 'x', 4000);
    return;
  }
  const st = S(), d = F[pl.t];
  if (pl.moveId) { const it = st.room.items.find(i => i.id === pl.moveId); if (it) Object.assign(it, d.wall ? {side: pl.side, x: pl.x} : {x: pl.x, y: pl.y, r: pl.r || 0}); }
  else st.room.items.push(d.wall ? {id: uid6(), t: pl.t, side: pl.side, x: pl.x, y: 0, r: 0, c: 0} : {id: uid6(), t: pl.t, x: pl.x, y: pl.y, r: pl.r || 0, c: 0});
  const moved = !!pl.moveId; UI.place = null; UI.sel = null;
  queueWrite('state', 0); render();
  toast(moved ? `${d.n}を移動しました。` : `${d.n}を置きました。`, 'check', 2600);
  try { publishPub(); checkBadges(false); } catch {}

function snapToFree(pl){
  const items = S().room.items, N = roomN(), d = F[pl.t];
  if (d.wall) {
    const c = []; for (const side of ['R', 'L']) for (let q = 0; q + d.W <= N; q++) c.push({side, q, dist: (side === pl.side ? 0 : N) + Math.abs(q - pl.x)});
    c.sort((a, b) => a.dist - b.dist); const f = c.find(o => canPlaceWall(items, N, pl.t, o.side, o.q, pl.moveId));
    if (!f) return false; pl.side = f.side; pl.x = f.q; return true;
  }
  const [w, dd] = placeDims(pl), c = [];
  for (let ax = 0; ax + w <= N; ax++) for (let ay = 0; ay + dd <= N; ay++) c.push({ax, ay, dist: (ax - pl.x) ** 2 + (ay - pl.y) ** 2});
  c.sort((a, b) => a.dist - b.dist); const f = c.find(o => canPlace(items, N, pl.t, o.ax, o.ay, pl.r || 0, pl.moveId));
  if (!f) return false; pl.x = f.ax; pl.y = f.ay; return true;
}
function svgPoint(svg, cx, cy){
  const m = svg.getScreenCTM(); if (!m) return null;
  const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy; return pt.matrixTransform(m.inverse());
}
function candidateFromPoint(sx, sy){
  const pl = UI.place, st = S(), N = roomN(), d = F[pl.t], items = st.room.items;
  if (d.wall) {
    const side = sx >= 0 ? 'R' : 'L', u = side === 'R' ? sx / TW : (sx + N * TW) / TW;
    const p0 = clamp(Math.round(u - d.W / 2), 0, N - d.W);
    const cands = []; for (let q = 0; q + d.W <= N; q++) cands.push(q);
    cands.sort((x, y) => Math.abs(x - p0) - Math.abs(y - p0));
    const q = cands.find(c => canPlaceWall(items, N, pl.t, side, c, pl.moveId));
    pl.side = side; pl.x = q !== undefined ? q : p0; return true;
  }
  const fx = (sx / TW + sy / TH) / 2, fy = (sy / TH - sx / TW) / 2;
  if (fx < 0 || fy < 0 || fx >= N || fy >= N) return false;
  const [w, dd] = placeDims(pl), tx = Math.floor(fx), ty = Math.floor(fy), cands = [];
  for (let i = 0; i < w; i++) for (let j = 0; j < dd; j++) { const ax = tx - i, ay = ty - j; if (ax < 0 || ay < 0 || ax + w > N || ay + dd > N) continue; cands.push({ax, ay, dist: (ax + w / 2 - fx) ** 2 + (ay + dd / 2 - fy) ** 2}); }
  cands.sort((p, q) => p.dist - q.dist);
  const c = cands.find(q => canPlace(items, N, pl.t, q.ax, q.ay, pl.r || 0, pl.moveId)) || cands[0];
  if (!c) return false;
  pl.x = c.ax; pl.y = c.ay; return true;
}
let tapGuard = 0, btnGuard = {act: null, t: 0};
function roomTap(e, rs){
  if (e.target.closest('[data-act]') || e.target.closest('.roombar')) return false;
  const svg = rs.querySelector('svg.roomsvg'); if (!svg) return false;
  if (UI.place) { const p = svgPoint(svg, e.clientX, e.clientY); if (p && candidateFromPoint(p.x, p.y)) render(); return true; }
  const it = e.target.closest('[data-i]');
  if (it) UI.sel = UI.sel === it.dataset.i ? null : it.dataset.i;
  else if (UI.sel) UI.sel = null;
  else return false;
  UI.colorOpen = false; render(); return true;
}
function wireRoom(rs){
  let down = null;
  rs.addEventListener('pointerdown', e => { down = {x: e.clientX, y: e.clientY, t: Date.now()}; });
  rs.addEventListener('pointerup', e => {
    if (!down) return; const d = down; down = null;
    const tapLike = Math.hypot(e.clientX - d.x, e.clientY - d.y) < 14 && Date.now() - d.t < 900;
    const btn = e.target.closest('.roombar [data-act]');
    if (btn) { if (tapLike && !btn.disabled && ACT[btn.dataset.act]) { btnGuard = {act: btn.dataset.act, t: Date.now()}; ACT[btn.dataset.act](btn, e); } return; }
    if (tapLike && roomTap(e, rs)) tapGuard = Date.now();
  });
  rs.addEventListener('click', e => {
    if (Date.now() - tapGuard < 800) { if (!e.target.closest('[data-act]')) e.stopPropagation(); return; }
    if (roomTap(e, rs)) e.stopPropagation();
  });
}

    if (!pubDocs.find(p => p.code === c)) { toast('そのコードの人が見つかりません。相手がランキング参加をオンにしているか確認してください。', 'x', 5000); return; }
    st.friends.push(c); queueWrite('state'); pendingRender = false; render(); toast('友達を追加しました。', 'users'); }
  if (k === 'group') { st.group = val('grp').toUpperCase().replace(/[^A-Z0-9\-_]/g, '').slice(0, 12); queueWrite('state'); publishPub(); pendingRender = false; UI.rankScope = st.group ? 'group' : UI.rankScope; render(); toast(st.group ? `グループ「${st.group}」に参加しました。` : 'グループから退出しました。', 'users'); }
  if (k === 'exam-add') { const n = val('ex-name'), d = val('ex-date'); if (!n || !d) { toast('試験名と日付を入力してください。', 'x'); return; } st.exams.push({id: uid6(), name: n.slice(0, 40), date: d}); queueWrite('state'); pendingRender = false; render(); toast('試験日を追加しました。', 'cal'); }
  if (k === 'exam-edit') { const e2 = st.exams.find(x => x.id === f.dataset.v), n = val('ee-name'), d = val('ee-date'); if (e2 && n && d) { e2.name = n.slice(0, 40); e2.date = d; queueWrite('state'); } UI.editExam = null; pendingRender = false; render(); }
  if (k === 'tg-add') { const u = val('tg-univ'); if (!u) { toast('大学名を入力してください。', 'x'); return; } st.targets.push({id: uid6(), univ: u.slice(0, 30), fac: val('tg-fac').slice(0, 30)}); queueWrite('state'); pendingRender = false; render(); }
  if (k === 'review') {
    const today = dkey(), mk = monthOf(today), md = monthDoc(mk);
    md.reviews[today] = {did: val('rv-did').slice(0, 600), tomorrow: val('rv-tom').slice(0, 400), tg: clamp(+val('rv-tg') || 0, 0, 1200), at: Date.now()};
    UI.review = null; queueWrite('m-' + mk, 0); checkMissions(false); checkBadges(false); pendingRender = false; render(); toast('振り返りを保存しました。今日もおつかれさま。', 'moon', 4000);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'snd-vol') { S().prefs.vol = +t.value; AudioEng.setVol(+t.value); queueWrite('state', 1500); }
  if (t.id === 't-custom') { const v = Math.round(+t.value); if (v >= 1 && v <= 600) { T.target = v; saveTimer(); updateTimerUI(); } }
  if (t.id === 'rv-did' || t.id === 'rv-tom' || t.id === 'rv-tg') UI.review = {did: $('#rv-did')?.value || '', tomorrow: $('#rv-tom')?.value || '', tg: $('#rv-tg')?.value || ''};
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'rv-time' && t.value) { S().prefs.reviewTime = t.value; queueWrite('state'); toast(`毎晩${t.value}にお知らせします。`, 'moon'); }
  if (t.id === 't-custom') render();
});
document.addEventListener('keydown', e => { if (UI.place && route() === 'room' && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) { const m = {ArrowLeft: F[UI.place.t].wall ? 'wl' : 'xm', ArrowRight: F[UI.place.t].wall ? 'wr' : 'xp', ArrowUp: 'ym', ArrowDown: 'yp'}[e.key]; if (m) { e.preventDefault(); nudgePlace(m); return; } if (e.key === 'Enter') { e.preventDefault(); commitPlace(); return; } } if (e.key === 'Escape') { if (UI.place) { UI.place = null; render(); } else if (modalOpen && !$('[data-form="onboard"]')) closeModal(); $('#sheet')?.remove(); } });

/* ---------- periodic: live countdown, review reminder, clock, day change ---------- */
let lastDay = dkey();
setInterval(() => {
  if (!S()) return;
  const cd = $('#cd-live'); if (cd) { const ex = nextExam(); if (ex) cd.innerHTML = liveCountdown(ex.date); }
}, 1000);
setInterval(() => {
  if (!S()) return;
  const today = dkey();
  if (today !== lastDay) { lastDay = today; dataV++; scheduleRender(); }
  if (UI.reviewToasted !== today && nowHM() >= S().prefs.reviewTime && !todayInfo().reviewed && S().onboarded) { UI.reviewToasted = today; toast('振り返りの時間です。今日の記録をまとめよう。', 'moon', 6000); if (route() === 'home') scheduleRender(); }
  if (route() === 'room' && S().room.items.some(i => i.t === 'clock') && !UI.place && !modalOpen) scheduleRender();
}, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && T.state === 'run') { requestWake(); tick(); } });

/* ---------- sign-in screen ---------- */
function authMsg(e){
  const m = String((e && e.message) || '').toLowerCase();
  if (m.includes('invalid login')) return 'メールアドレスかパスワードが違います。';
  if (m.includes('already registered') || m.includes('already been registered') || m.includes('already exists')) return 'このメールアドレスはすでに登録されています。「ログイン」からどうぞ。';
  if (m.includes('password should') || m.includes('at least 6') || m.includes('weak')) return 'パスワードは6文字以上にしてください。';
  if (m.includes('not confirmed')) return 'メールの確認がまだです。届いたメールのリンクを押してから、もう一度ログインしてください。';
  if (m.includes('rate limit') || m.includes('too many') || m.includes('security purposes')) return '短い時間に何度も試したため、少し待ってからもう一度お試しください。';
  if (m.includes('invalid') && m.includes('email')) return 'メールアドレスの形を確認してください。';
  if (m.includes('fetch') || m.includes('network')) return '通信できませんでした。電波の状態を確認してください。';
  return 'うまくいきませんでした：' + ((e && e.message) || '不明なエラー');
}
function renderAuth(){
  const t = UI.authTab, msg = UI.authMsg;
  const title = t === 'signup' ? '新規登録' : t === 'login' ? 'ログイン' : 'パスワードの再設定';
  $('#view').innerHTML = `<div class="stack fadein" style="padding-top:12px"><section class="panel hero auth">
    <span class="eyebrow">STUDY HARD</span><h1>今日の努力が、<br>未来の自分をつくる。</h1>
    <p class="note" style="margin:0">勉強した時間がそのまま経験値に。自分だけの勉強部屋を育てて、友達とランキングで競おう。</p>
    <div class="feat"><div>${icon('timer')}勉強タイマー</div><div>${icon('room')}育つ勉強部屋</div><div>${icon('trophy')}友達ランキング</div></div>
    ${t !== 'reset' ? `<div class="seg" style="margin-top:18px;width:100%;display:grid;grid-template-columns:1fr 1fr"><button data-act="auth-tab" data-v="signup" class="${t === 'signup' ? 'on' : ''}">新規登録</button><button data-act="auth-tab" data-v="login" class="${t === 'login' ? 'on' : ''}">ログイン</button></div>` : `<h2 style="margin:18px 0 0;font-size:17px">${title}</h2>`}
    <form data-form="auth" novalidate>
      ${t === 'signup' ? '<label class="fld" for="au-nick">ニックネーム（ランキングに表示）<input id="au-nick" type="text" maxlength="20" autocomplete="nickname" placeholder="例：たける"></label>' : ''}
      <label class="fld" for="au-email">メールアドレス<input id="au-email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required></label>
      ${t !== 'reset' ? `<label class="fld" for="au-pw">パスワード（6文字以上）<input id="au-pw" type="password" minlength="6" autocomplete="${t === 'signup' ? 'new-password' : 'current-password'}" required></label>` : '<p class="note" style="margin:0">登録したメールアドレスに、パスワードを設定し直すためのリンクを送ります。</p>'}
      ${msg ? `<div class="msg ${msg.ok ? 'ok' : ''}" role="status">${esc(msg.text)}</div>` : ''}
      <button class="btn primary big wide" type="submit" ${UI.authBusy ? 'disabled' : ''}>${UI.authBusy ? '通信中…' : t === 'signup' ? '登録してはじめる' : t === 'login' ? 'ログイン' : 'リンクを送る'}</button>
    </form>
    <div class="row wrap" style="justify-content:center;margin-top:10px">${t === 'reset' ? '<button class="btn sm ghost" data-act="auth-tab" data-v="login">ログインに戻る</button>' : '<button class="btn sm ghost" data-act="auth-tab" data-v="reset">パスワードを忘れた</button>'}</div>
    </section>
    ${LS.get('sh-pending-friend') ? '<p class="banner">友達からの招待リンクで開きました。登録すると、その友達とランキングで競えます。</p>' : ''}</div>`;
}
async function doAuth(f){
  if (UI.authBusy) return;
  const t = UI.authTab, email = (f.querySelector('#au-email')?.value || '').trim(), pw = f.querySelector('#au-pw')?.value || '';
  const nick = (f.querySelector('#au-nick')?.value || '').trim();
  if (!email) { UI.authMsg = {text: 'メールアドレスを入力してください。'}; render(); return; }
  if (t !== 'reset' && pw.length < 6) { UI.authMsg = {text: 'パスワードは6文字以上にしてください。'}; render(); return; }
  UI.authBusy = true; UI.authMsg = null; render();
  try {
    if (t === 'login') {
      const {data: d, error} = await SB.auth.signInWithPassword({email, password: pw});
      if (error) throw error;
      UI.authBusy = false; await startCloud(d.user); return;
    }
    if (t === 'signup') {
      UI.signupNick = nick.slice(0, 20);
      const {data: d, error} = await SB.auth.signUp({email, password: pw, options: {emailRedirectTo: location.origin + location.pathname}});
      if (error) throw error;
      if (d.session) { UI.authBusy = false; await startCloud(d.user); return; }
      if (d.user && Array.isArray(d.user.identities) && d.user.identities.length === 0) throw new Error('already registered');
      UI.authTab = 'login'; UI.authMsg = {ok: true, text: '確認メールを送りました。メールのリンクを押したあと、ここからログインしてください。'};
    }
    if (t === 'reset') {
      const {error} = await SB.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
      if (error) throw error;
      UI.authMsg = {ok: true, text: 'パスワード再設定のメールを送りました。メールのリンクを開いてください。'};
    }
  } catch (e) { UI.authMsg = {text: authMsg(e)}; }
  UI.authBusy = false; render();
  setTimeout(() => { const v = $('#au-email'); if (v && !v.value) v.value = email; }, 0);
}
function showNewPassword(){
  showModal(`<h3>新しいパスワードを設定</h3><p class="note" style="font-size:14px">6文字以上で入力してください。</p>
    <form class="stack" data-form="newpw" style="gap:12px"><input id="np-new" type="password" minlength="6" autocomplete="new-password" aria-label="新しいパスワード" autofocus>
    <div class="acts"><button class="btn primary" type="submit">設定する</button></div></form>`, {sticky: true});
}
const _render = render;
render = function(){
  document.body.classList.toggle('authmode', MODE === 'auth');
  if (MODE === 'auth') { renderAuth(); return; }
  if (!S()) { $('#view').innerHTML = '<div class="empty" style="padding-top:80px">読み込み中…</div>'; return; }
  _render();
  if (route() === 'rank') refreshPub();
  const rs = $('#roomstage'); if (rs) wireRoom(rs);
};
document.addEventListener('visibilitychange', () => { if (!document.hidden && MODE === 'cloud' && !pending.size) { pullCloud(false); refreshPub(true); } });
window.addEventListener('pagehide', () => { if (MODE === 'cloud' && pending.size) flushAll(); });

window.addEventListener('error', e => { try { toast('エラーが起きました：' + (e.message || '不明') + '（ページを開き直してください）', 'x', 6000); } catch {} });
boot();
})();
</script>
